<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:15px Arial;background:#f3f7f2;color:#183323;margin:0}header{background:#075b2a;color:white;padding:22px}main{max-width:1000px;margin:25px auto;padding:0 16px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.btn{border:0;background:#075b2a;color:white;padding:11px 16px;border-radius:7px;cursor:pointer}.tabs .active{background:#159447}.panel{background:white;padding:22px;border:1px solid #dce8dc;border-radius:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:bold;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd8cc;border-radius:6px;box-sizing:border-box}textarea{min-height:85px}.row{border-bottom:1px solid #e5ece5;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.danger{background:#a52a2a}.hidden{display:none}
</style></head><body><header><h1>Gerenciamento do Sindicato Rural</h1><p>Cursos, palestras e fotos dos eventos</p></header><main><div class="tabs"><button class="active" onclick="tab('ev',this)">Eventos</button><button onclick="tab('ph',this)">Galeria</button></div>
<section id="ev" class="panel"><h2>Adicionar / editar evento</h2><form id="eventForm"><input type="hidden" name="ID"><div class="grid"><div><label>Título</label><input name="Titulo" required></div><div><label>Data início</label><input name="DataInicio" type="date" required></div><div><label>Data fim</label><input name="DataFim" type="date" required></div><div><label>Horário</label><input name="Horario" required></div><div><label>Local</label><input name="Local" required></div></div><p><label>Descrição</label><textarea name="Descricao"></textarea></p><button class="btn">Salvar evento</button><button type="reset" class="btn" style="background:#718071">Limpar</button></form><h3>Eventos</h3><div id="eventList"></div></section>
<section id="ph" class="panel hidden"><h2>Adicionar foto</h2><form id="photoForm"><div class="grid"><div><label>Evento</label><select name="EventoID" id="eventSelect" required></select></div><div><label>Nome da foto</label><input name="NomeFoto" required></div><div><label>Data da foto</label><input name="DataFoto" type="date" required></div><div><label>Arquivo da foto</label><input name="Foto" type="file" accept="image/*" required></div></div><p><button class="btn">Enviar para Google Drive</button></p></form><h3>Fotos cadastradas</h3><div id="photoList"></div></section></main>
<script>
let state={eventos:[],galeria:[]};function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function load(){google.script.run.withSuccessHandler(d=>{state=d;draw()}).adminGetData()}function draw(){let list=document.getElementById('eventList');list.innerHTML='';let sel=document.getElementById('eventSelect');sel.innerHTML='<option value="">Selecione</option>';state.eventos.forEach(e=>{let o=document.createElement('option');o.value=e.ID;o.textContent=e.Titulo;sel.appendChild(o);let r=document.createElement('div');r.className='row';let s=document.createElement('span');s.textContent=e.Titulo+' ('+e.DataInicio+' a '+e.DataFim+')';r.appendChild(s);let edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>{let f=document.getElementById('eventForm');Object.keys(e).forEach(k=>{if(f.elements[k])f.elements[k].value=e[k]})};r.appendChild(edit);let del=document.createElement('button');del.textContent='Excluir';del.className='danger';del.onclick=()=>{if(confirm('Excluir evento e fotos relacionadas?'))google.script.run.withSuccessHandler(load).deleteEvent(e.ID)};r.appendChild(del);list.appendChild(r)});let pl=document.getElementById('photoList');pl.innerHTML='';state.galeria.forEach(g=>{let r=document.createElement('div');r.className='row';let a=document.createElement('a');a.href=g.FotoURL;a.target='_blank';a.textContent=g.Titulo+' — '+g.NomeFoto;r.appendChild(a);let del=document.createElement('button');del.textContent='Excluir';del.className='danger';del.onclick=()=>{if(confirm('Excluir foto?'))google.script.run.withSuccessHandler(load).deletePhoto(g.ID)};r.appendChild(del);pl.appendChild(r)})}
document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));google.script.run.withSuccessHandler(()=>{e.target.reset();load();alert('Evento salvo.')}).withFailureHandler(x=>alert(x.message)).saveEvent(o)};
document.getElementById('photoForm').onsubmit=async e=>{e.preventDefault();let f=e.target.Foto.files[0];if(!f)return;let b=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});let o=Object.fromEntries(new FormData(e.target));o.base64=b;o.mimeType=f.type;o.fileName=f.name;delete o.Foto;google.script.run.withSuccessHandler(()=>{e.target.reset();load();alert('Foto enviada para a pasta Fotos dos eventos.')}).withFailureHandler(x=>alert(x.message)).savePhoto(o)};
load();
</script></body></html>
